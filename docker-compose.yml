services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      RISKLAB_CACHE_DIR: /data/cache
      RISKLAB_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - risklab_cache:/data/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  risklab_cache:
